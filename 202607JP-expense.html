<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 京阪之旅 - 旅遊記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-btn.active {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }
        .main-tab-content { display: none; }
        .main-tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .category-food { border-left-color: #f97316; }
        .category-transport { border-left-color: #3b82f6; }
        .category-ticket { border-left-color: #8b5cf6; }
        .category-shopping { border-left-color: #ec4899; }
        .category-hotel { border-left-color: #14b8a6; }
        .category-other { border-left-color: #6b7280; }
        .sync-status {
            transition: all 0.3s;
        }
        .sync-status.syncing {
            color: #f59e0b;
        }
        .sync-status.synced {
            color: #10b981;
        }
        .sync-status.error {
            color: #ef4444;
        }
    </style>
</head>
<body class="text-slate-800">
    <!-- Header -->
    <header class="bg-indigo-700 text-white py-10 px-4 text-center shadow-lg">
        <h1 class="text-3xl md:text-4xl font-bold mb-2"><i class="fas fa-calculator mr-2"></i>旅遊記帳本</h1>
        <p class="text-indigo-100 text-lg italic">2026 京阪之旅 花費紀錄</p>
        <div class="mt-3 flex items-center justify-center gap-4">
            <a href="home.html#shopping" onclick="localStorage.setItem('jp2026_tab','shopping')" class="text-indigo-200 hover:text-white text-sm">
                <i class="fas fa-arrow-left mr-1"></i> 返回代購清單
            </a>
            <span class="sync-status text-sm" id="syncStatus">
                <i class="fas fa-cloud"></i> <span id="syncText">連線中...</span>
            </span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-8 space-y-6">

        <!-- 匯率設定 -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-sm text-slate-600"><i class="fas fa-yen-sign mr-1"></i>匯率設定:</span>
                    <input type="number" id="exchangeRate" value="0.22" step="0.01" min="0.01" 
                        class="w-20 px-2 py-1 border border-slate-300 rounded-lg text-center text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <span class="text-sm text-slate-500">TWD/JPY</span>
                </div>
                <div class="text-xs text-slate-400">
                    <i class="fas fa-sync-alt mr-1"></i>資料自動雲端同步
                </div>
            </div>
        </section>

        <!-- 統計摘要 -->
        <section class="bg-gradient-to-r from-indigo-500 to-purple-600 p-6 rounded-2xl shadow-lg text-white">
            <h2 class="text-lg font-bold mb-4"><i class="fas fa-chart-pie mr-2"></i>花費統計</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                <div class="bg-white/20 backdrop-blur rounded-xl p-3 text-center">
                    <p class="text-xs opacity-80">個人總花費</p>
                    <p class="text-xl font-bold">¥<span id="totalPersonal">0</span></p>
                    <p class="text-xs opacity-70">≈ NT$<span id="totalPersonalTWD">0</span></p>
                </div>
                <div class="bg-white/20 backdrop-blur rounded-xl p-3 text-center">
                    <p class="text-xs opacity-80">代購總金額</p>
                    <p class="text-xl font-bold">¥<span id="totalProxy">0</span></p>
                    <p class="text-xs opacity-70">≈ NT$<span id="totalProxyTWD">0</span></p>
                </div>
                <div class="bg-white/20 backdrop-blur rounded-xl p-3 text-center">
                    <p class="text-xs opacity-80">代購已收款</p>
                    <p class="text-xl font-bold text-emerald-300">NT$<span id="totalProxyPaid">0</span></p>
                </div>
                <div class="bg-white/20 backdrop-blur rounded-xl p-3 text-center">
                    <p class="text-xs opacity-80">代購待收款</p>
                    <p class="text-xl font-bold text-amber-300">NT$<span id="totalProxyUnpaid">0</span></p>
                </div>
            </div>
            <!-- 分類統計 -->
            <div class="grid grid-cols-3 md:grid-cols-6 gap-2 text-center text-xs">
                <div class="bg-orange-400/30 rounded-lg p-2">
                    <i class="fas fa-utensils"></i>
                    <p>餐飲</p>
                    <p class="font-bold">¥<span id="catFood">0</span></p>
                </div>
                <div class="bg-blue-400/30 rounded-lg p-2">
                    <i class="fas fa-train"></i>
                    <p>交通</p>
                    <p class="font-bold">¥<span id="catTransport">0</span></p>
                </div>
                <div class="bg-purple-400/30 rounded-lg p-2">
                    <i class="fas fa-ticket"></i>
                    <p>門票</p>
                    <p class="font-bold">¥<span id="catTicket">0</span></p>
                </div>
                <div class="bg-pink-400/30 rounded-lg p-2">
                    <i class="fas fa-shopping-bag"></i>
                    <p>購物</p>
                    <p class="font-bold">¥<span id="catShopping">0</span></p>
                </div>
                <div class="bg-teal-400/30 rounded-lg p-2">
                    <i class="fas fa-bed"></i>
                    <p>住宿</p>
                    <p class="font-bold">¥<span id="catHotel">0</span></p>
                </div>
                <div class="bg-gray-400/30 rounded-lg p-2">
                    <i class="fas fa-ellipsis-h"></i>
                    <p>其他</p>
                    <p class="font-bold">¥<span id="catOther">0</span></p>
                </div>
            </div>
        </section>

        <!-- 主分頁標籤 -->
        <section class="sticky top-2 z-30">
            <div class="flex overflow-x-auto no-scrollbar py-2 gap-2 bg-slate-50/80 backdrop-blur-md rounded-xl p-1 shadow-sm">
                <button onclick="showMainTab('personal')" id="btn-main-personal" class="tab-btn active shrink-0 flex-1 px-5 py-2 rounded-lg border border-slate-200 bg-white font-bold transition-all text-sm">
                    <i class="fas fa-user mr-1"></i> 個人花費
                </button>
                <button onclick="showMainTab('proxy')" id="btn-main-proxy" class="tab-btn shrink-0 flex-1 px-5 py-2 rounded-lg border border-slate-200 bg-white font-bold transition-all text-sm">
                    <i class="fas fa-users mr-1"></i> 代購記帳
                </button>
            </div>
        </section>

        <!-- 個人花費分頁 -->
        <div id="main-tab-personal" class="main-tab-content active">
            <!-- 新增花費表單 -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-4">
                <h3 class="font-bold text-slate-700 mb-3"><i class="fas fa-plus-circle mr-2 text-indigo-500"></i>新增花費</h3>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs text-slate-500">日期</label>
                        <input type="date" id="expenseDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">分類</label>
                        <select id="expenseCategory" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="food">🍜 餐飲</option>
                            <option value="transport">🚃 交通</option>
                            <option value="ticket">🎫 門票</option>
                            <option value="shopping">🛍️ 購物</option>
                            <option value="hotel">🏨 住宿</option>
                            <option value="other">📦 其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">金額 (日幣)</label>
                        <input type="number" id="expenseAmount" placeholder="¥" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">商品名稱</label>
                        <input type="text" id="expenseItem" placeholder="商品..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">付款方式</label>
                        <select id="expensePayment" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="paypay_esun">PayPay (玉山)</option>
                            <option value="paypay_taishin">PayPay (台新)</option>
                            <option value="card_esun">玉山卡</option>
                            <option value="card_taishin">台新卡</option>
                            <option value="cash">現金</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">備註</label>
                        <input type="text" id="expenseNote" placeholder="說明..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <button onclick="addExpense()" class="mt-3 w-full py-2 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 transition">
                    <i class="fas fa-plus mr-1"></i> 新增記錄
                </button>
            </section>

            <!-- 花費列表 -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-700 mb-3"><i class="fas fa-list mr-2 text-indigo-500"></i>花費記錄</h3>
                <div id="expenseList" class="space-y-2 max-h-96 overflow-y-auto">
                    <p class="text-center text-slate-400 py-8"><i class="fas fa-spinner fa-spin mr-2"></i>載入中...</p>
                </div>
            </section>
        </div>

        <!-- 代購分頁 -->
        <div id="main-tab-proxy" class="main-tab-content">
            <!-- 從代購清單導入 -->
            <section class="bg-amber-50 p-4 rounded-2xl shadow-sm border border-amber-200 mb-4">
                <div class="flex items-center justify-between flex-wrap gap-3">
                    <div>
                        <h3 class="font-bold text-amber-700"><i class="fas fa-file-import mr-2"></i>從代購清單導入</h3>
                        <p class="text-xs text-amber-600 mt-1">將行程頁面中「已勾選」的代購品項導入記帳</p>
                    </div>
                    <button onclick="importFromShopping()" class="px-4 py-2 bg-amber-500 text-white rounded-lg font-bold hover:bg-amber-600 transition text-sm">
                        <i class="fas fa-download mr-1"></i> 導入已購品項
                    </button>
                </div>
                <div id="importPreview" class="mt-3 hidden">
                    <p class="text-sm text-amber-700 mb-2">即將導入以下品項：</p>
                    <div id="importList" class="max-h-40 overflow-y-auto space-y-1"></div>
                    <div class="flex gap-2 mt-3">
                        <button onclick="confirmImport()" class="flex-1 py-2 bg-emerald-500 text-white rounded-lg font-bold hover:bg-emerald-600 transition text-sm">
                            <i class="fas fa-check mr-1"></i> 確認導入
                        </button>
                        <button onclick="cancelImport()" class="flex-1 py-2 bg-slate-400 text-white rounded-lg font-bold hover:bg-slate-500 transition text-sm">
                            <i class="fas fa-times mr-1"></i> 取消
                        </button>
                    </div>
                </div>
            </section>

            <!-- 新增代購表單 -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-4">
                <h3 class="font-bold text-slate-700 mb-3"><i class="fas fa-plus-circle mr-2 text-yellow-500"></i>新增代購</h3>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs text-slate-500">委託人</label>
                        <input type="text" id="proxyPerson" placeholder="姓名" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">商品名稱</label>
                        <input type="text" id="proxyItem" placeholder="商品..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">數量</label>
                        <input type="number" id="proxyQty" value="1" min="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">單價 (日幣)</label>
                        <input type="number" id="proxyPrice" placeholder="¥" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">收款金額 (台幣)</label>
                        <input type="number" id="proxyCharge" placeholder="NT$" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    <div class="flex items-end">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="proxyPaid" class="w-4 h-4 text-emerald-500 rounded focus:ring-emerald-500">
                            <span class="text-sm text-slate-600">已收款</span>
                        </label>
                    </div>
                </div>
                <button onclick="addProxy()" class="mt-3 w-full py-2 bg-yellow-500 text-white rounded-lg font-bold hover:bg-yellow-600 transition">
                    <i class="fas fa-plus mr-1"></i> 新增代購
                </button>
            </section>

            <!-- 代購列表 -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-700 mb-3"><i class="fas fa-list mr-2 text-yellow-500"></i>代購清單</h3>
                <div id="proxyList" class="space-y-2 max-h-96 overflow-y-auto">
                    <p class="text-center text-slate-400 py-8"><i class="fas fa-spinner fa-spin mr-2"></i>載入中...</p>
                </div>
            </section>
        </div>
    </main>

    <!-- 編輯花費彈窗 -->
    <div id="expenseModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
            <div class="flex items-center justify-between p-4 border-b border-slate-200">
                <h3 class="font-bold text-lg text-slate-700"><i class="fas fa-pen mr-2 text-indigo-500"></i>編輯花費</h3>
                <button onclick="closeExpenseModal()" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4 space-y-3">
                <input type="hidden" id="modalExpenseKey">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-500">日期</label>
                        <input type="date" id="modalExpenseDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">分類</label>
                        <select id="modalExpenseCategory" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="food">🍜 餐飲</option>
                            <option value="transport">🚃 交通</option>
                            <option value="ticket">🎫 門票</option>
                            <option value="shopping">🛍️ 購物</option>
                            <option value="hotel">🏨 住宿</option>
                            <option value="other">📦 其他</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-500">金額 (日幣)</label>
                    <input type="number" id="modalExpenseAmount" placeholder="¥" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="text-xs text-slate-500">商品名稱</label>
                    <input type="text" id="modalExpenseItem" placeholder="商品..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="text-xs text-slate-500">付款方式</label>
                    <select id="modalExpensePayment" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="paypay_esun">PayPay (玉山)</option>
                        <option value="paypay_taishin">PayPay (台新)</option>
                        <option value="card_esun">玉山卡</option>
                        <option value="card_taishin">台新卡</option>
                        <option value="cash">現金</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-500">備註</label>
                    <input type="text" id="modalExpenseNote" placeholder="說明..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="flex gap-2 p-4 border-t border-slate-200">
                <button onclick="saveExpenseModal()" class="flex-1 py-2 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 transition">
                    <i class="fas fa-save mr-1"></i> 儲存
                </button>
                <button onclick="deleteExpenseModal()" class="px-4 py-2 bg-red-500 text-white rounded-lg font-bold hover:bg-red-600 transition">
                    <i class="fas fa-trash-alt mr-1"></i> 刪除
                </button>
            </div>
        </div>
    </div>

    <!-- 編輯代購彈窗 -->
    <div id="proxyModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
            <div class="flex items-center justify-between p-4 border-b border-slate-200">
                <h3 class="font-bold text-lg text-slate-700"><i class="fas fa-pen mr-2 text-yellow-500"></i>編輯代購</h3>
                <button onclick="closeProxyModal()" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4 space-y-3">
                <input type="hidden" id="modalProxyKey">
                <div>
                    <label class="text-xs text-slate-500">委託人</label>
                    <input type="text" id="modalProxyPerson" placeholder="姓名" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                </div>
                <div>
                    <label class="text-xs text-slate-500">商品名稱</label>
                    <input type="text" id="modalProxyItem" placeholder="商品..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-500">數量</label>
                        <input type="number" id="modalProxyQty" value="1" min="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">單價 (日幣)</label>
                        <input type="number" id="modalProxyPrice" placeholder="¥" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-500">收款金額 (台幣)</label>
                        <input type="number" id="modalProxyCharge" placeholder="NT$" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    </div>
                    <div class="flex items-end pb-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="modalProxyPaid" class="w-5 h-5 text-emerald-500 rounded focus:ring-emerald-500">
                            <span class="text-sm text-slate-600">已收款</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="flex gap-2 p-4 border-t border-slate-200">
                <button onclick="saveProxyModal()" class="flex-1 py-2 bg-yellow-500 text-white rounded-lg font-bold hover:bg-yellow-600 transition">
                    <i class="fas fa-save mr-1"></i> 儲存
                </button>
                <button onclick="deleteProxyModal()" class="px-4 py-2 bg-red-500 text-white rounded-lg font-bold hover:bg-red-600 transition">
                    <i class="fas fa-trash-alt mr-1"></i> 刪除
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Firebase 初始化（使用與代購清單相同的資料庫）
        firebase.initializeApp({

        });

        // 初始化日期

            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        // 新增個人花費
        function addExpense() {
            const date = document.getElementById('expenseDate').value;
            const category = document.getElementById('expenseCategory').value;
            const amount = parseInt(document.getElementById('expenseAmount').value) || 0;
            const item = document.getElementById('expenseItem').value;
            const payment = document.getElementById('expensePayment').value;
            const note = document.getElementById('expenseNote').value;

            if (!date || amount <= 0) {
                alert('請填寫日期和金額');
                return;
            }

            setSyncStatus('syncing', '同步中...');
            expensesRef.push({ date, category, amount, item, payment, note, createdAt: Date.now() })
                .then(() => {
                    document.getElementById('expenseAmount').value = '';
                    document.getElementById('expenseItem').value = '';
                    document.getElementById('expenseNote').value = '';
                })
                .catch(err => {
                    setSyncStatus('error', '同步失敗');
                    alert('儲存失敗：' + err.message);
                });
        }

        // 取得分類資訊
        function getCategoryInfo(cat) {
            const info = {
                food: { icon: '🍜', name: '餐飲', class: 'category-food' },
                transport: { icon: '🚃', name: '交通', class: 'category-transport' },
                ticket: { icon: '🎫', name: '門票', class: 'category-ticket' },
                shopping: { icon: '🛍️', name: '購物', class: 'category-shopping' },
                hotel: { icon: '🏨', name: '住宿', class: 'category-hotel' },
                other: { icon: '📦', name: '其他', class: 'category-other' }
            };
            return info[cat] || info.other;
        }

        // 取得付款方式資訊
        function getPaymentInfo(payment) {
            const info = {
                paypay_esun: { icon: '📱', name: 'PayPay(玉山)', class: 'text-blue-600' },
                paypay_taishin: { icon: '📱', name: 'PayPay(台新)', class: 'text-purple-600' },
                card_esun: { icon: '💳', name: '玉山卡', class: 'text-blue-600' },
                card_taishin: { icon: '💳', name: '台新卡', class: 'text-purple-600' },
                cash: { icon: '💴', name: '現金', class: 'text-emerald-600' }
            };
            return info[payment] || info.cash;
        }

        // 渲染花費列表
        function renderExpenses(data) {
            const list = document.getElementById('expenseList');
            if (!data || Object.keys(data).length === 0) {
                list.innerHTML = '<p class="text-center text-slate-400 py-8">尚無花費記錄</p>';
                return;
            }

            const rate = parseFloat(document.getElementById('exchangeRate').value) || 0.22;
            const entries = Object.entries(data).sort((a, b) => {
                const dateCompare = new Date(b[1].date) - new Date(a[1].date);
                if (dateCompare !== 0) return dateCompare;
                return (b[1].createdAt || 0) - (a[1].createdAt || 0);
            });
            
            list.innerHTML = entries.map(([key, e]) => {
                const cat = getCategoryInfo(e.category);
                const pay = getPaymentInfo(e.payment);
                const twd = Math.round(e.amount * rate);
                const itemText = e.item ? e.item : (e.note || cat.name);
                const noteText = e.item && e.note ? ` - ${e.note}` : '';
                return `
                    <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border-l-4 ${cat.class}">
                        <span class="text-2xl">${cat.icon}</span>
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-slate-700 truncate">${itemText}${noteText}</p>
                            <p class="text-xs text-slate-500">${e.date} <span class="${pay.class}">${pay.icon} ${pay.name}</span></p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-indigo-600">¥${e.amount.toLocaleString()}</p>
                            <p class="text-xs text-slate-500">≈ NT$${twd.toLocaleString()}</p>
                        </div>
                        <button onclick="editExpense('${key}')" class="p-2 text-blue-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition">
                            <i class="fas fa-pen"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        // 渲染代購列表
        function renderProxy(data) {
            const list = document.getElementById('proxyList');
            if (!data || Object.keys(data).length === 0) {
                list.innerHTML = '<p class="text-center text-slate-400 py-8">尚無代購記錄</p>';
                return;
            }

            const rate = parseFloat(document.getElementById('exchangeRate').value) || 0.22;
            const grouped = {};
            
            Object.entries(data).forEach(([key, p]) => {
                if (!grouped[p.person]) grouped[p.person] = [];
                grouped[p.person].push({ key, ...p });
            });

            let html = '';
            for (const person in grouped) {
                const items = grouped[person];
                const totalJPY = items.reduce((sum, p) => sum + p.price * p.qty, 0);
                const totalCharge = items.reduce((sum, p) => sum + (p.charge || Math.round(p.price * p.qty * rate)), 0);
                const allPaid = items.every(p => p.paid);
                
                html += `<div class="mb-4 p-3 bg-yellow-50 rounded-xl border border-yellow-200">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-bold text-slate-700"><i class="fas fa-user mr-1"></i>${person}</span>
                        <span class="text-sm ${allPaid ? 'text-emerald-600' : 'text-amber-600'}">
                            ${allPaid ? '<i class="fas fa-check-circle mr-1"></i>已收款' : '<i class="fas fa-clock mr-1"></i>待收款'}
                            NT$${totalCharge.toLocaleString()}
                        </span>
                    </div>
                    <div class="space-y-1">`;
                
                items.forEach(p => {
                    const itemTotal = p.price * p.qty;
                    const chargeAmount = p.charge || Math.round(itemTotal * rate);
                    html += `
                        <div class="flex items-center gap-2 text-sm p-2 bg-white rounded-lg">
                            <button onclick="toggleProxyPaid('${p.key}', ${p.paid})" class="w-5 h-5 rounded border ${p.paid ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'} flex items-center justify-center">
                                ${p.paid ? '<i class="fas fa-check text-xs"></i>' : ''}
                            </button>
                            <span class="flex-1 ${p.paid ? 'line-through text-slate-400' : ''}">${p.item} x${p.qty}</span>
                            <span class="text-slate-500">¥${itemTotal.toLocaleString()}</span>
                            <span class="text-indigo-600 font-medium">NT$${chargeAmount.toLocaleString()}</span>
                            <button onclick="editProxy('${p.key}')" class="p-1 text-blue-400 hover:text-blue-600">
                                <i class="fas fa-pen"></i>
                            </button>
                        </div>`;
                });
                
                html += `</div></div>`;
            }
            list.innerHTML = html;
        }

        // 更新統計
        function updateStats(expensesData, proxyData) {
            const rate = parseFloat(document.getElementById('exchangeRate').value) || 0.22;
            
            // 個人花費統計
            let totalPersonal = 0;
            const categories = { food: 0, transport: 0, ticket: 0, shopping: 0, hotel: 0, other: 0 };
            
            if (expensesData) {
                Object.values(expensesData).forEach(e => {
                    totalPersonal += e.amount;
                    categories[e.category] = (categories[e.category] || 0) + e.amount;
                });
            }
            
            document.getElementById('totalPersonal').textContent = totalPersonal.toLocaleString();
            document.getElementById('totalPersonalTWD').textContent = Math.round(totalPersonal * rate).toLocaleString();
            document.getElementById('catFood').textContent = categories.food.toLocaleString();
            document.getElementById('catTransport').textContent = categories.transport.toLocaleString();
            document.getElementById('catTicket').textContent = categories.ticket.toLocaleString();
            document.getElementById('catShopping').textContent = categories.shopping.toLocaleString();
            document.getElementById('catHotel').textContent = categories.hotel.toLocaleString();
            document.getElementById('catOther').textContent = categories.other.toLocaleString();

            // 代購統計
            let totalProxy = 0, totalPaid = 0, totalUnpaid = 0;
            
            if (proxyData) {
                Object.values(proxyData).forEach(p => {
                    const itemTotal = p.price * p.qty;
                    totalProxy += itemTotal;
                    const chargeAmount = p.charge || Math.round(itemTotal * rate);
                    if (p.paid) totalPaid += chargeAmount;
                    else totalUnpaid += chargeAmount;
                });
            }
            
            document.getElementById('totalProxy').textContent = totalProxy.toLocaleString();
            document.getElementById('totalProxyTWD').textContent = Math.round(totalProxy * rate).toLocaleString();
            document.getElementById('totalProxyPaid').textContent = totalPaid.toLocaleString();
            document.getElementById('totalProxyUnpaid').textContent = totalUnpaid.toLocaleString();
        }

        // 儲存當前資料供匯率變更時使用
        let currentExpensesData = null;
        let currentProxyData = null;

        // 匯率變更時更新顯示
        document.getElementById('exchangeRate').addEventListener('change', function() {
            // 儲存匯率到 Firebase
            settingsRef.set({ exchangeRate: this.value });
            // 重新渲染
            renderExpenses(currentExpensesData);
            renderProxy(currentProxyData);
            updateStats(currentExpensesData, currentProxyData);
        });

        // 即時監聽 Firebase 資料變化
        expensesRef.on('value', (snapshot) => {
            currentExpensesData = snapshot.val();
            setSyncStatus('synced', '已同步');
            renderExpenses(currentExpensesData);
            updateStats(currentExpensesData, currentProxyData);
        });

        proxyRef.on('value', (snapshot) => {
            currentProxyData = snapshot.val();
            setSyncStatus('synced', '已同步');
            renderProxy(currentProxyData);
            updateStats(currentExpensesData, currentProxyData);
        });

        // 讀取匯率設定
        settingsRef.on('value', (snapshot) => {
            const settings = snapshot.val();
            if (settings && settings.exchangeRate) {
                document.getElementById('exchangeRate').value = settings.exchangeRate;
            }
        });

        // ========== 從代購清單導入功能 ==========
        const shoppingRef = db.ref('shopping_items');
        let pendingImports = [];  // 新品項
        let pendingUpdates = [];  // 有變更的品項

        // 讀取已購買的代購品項
        function importFromShopping() {
            shoppingRef.once('value', (snapshot) => {
                const data = snapshot.val() || {};
                const checkedItems = [];
                
                Object.entries(data).forEach(([key, item]) => {
                    if (item.checked) {
                        checkedItems.push({ key, ...item });
                    }
                });

                if (checkedItems.length === 0) {
                    alert('沒有已勾選的代購品項可導入！\n請先到行程頁面的代購清單勾選已購買的品項。');
                    return;
                }

                // 比對現有記帳資料
                proxyRef.once('value', (proxySnapshot) => {
                    const existingProxy = proxySnapshot.val() || {};
                    
                    // 建立 sourceKey -> proxyKey 的對照表
                    const sourceKeyMap = {};
                    Object.entries(existingProxy).forEach(([proxyKey, p]) => {
                        if (p.sourceKey) {
                            sourceKeyMap[p.sourceKey] = { proxyKey, data: p };
                        }
                    });

                    pendingImports = [];
                    pendingUpdates = [];

                    checkedItems.forEach(item => {
                        if (sourceKeyMap[item.key]) {
                            // 已導入過，檢查是否有變更
                            const existing = sourceKeyMap[item.key];
                            const hasChanges = 
                                existing.data.person !== item.person ||
                                existing.data.item !== item.item ||
                                String(existing.data.qty) !== String(item.qty) ||
                                (existing.data.category || '') !== (item.category || '') ||
                                (existing.data.note || '') !== (item.note || '');
                            
                            if (hasChanges) {
                                pendingUpdates.push({
                                    proxyKey: existing.proxyKey,
                                    sourceKey: item.key,
                                    old: existing.data,
                                    new: item
                                });
                            }
                        } else {
                            // 新品項
                            pendingImports.push(item);
                        }
                    });

                    if (pendingImports.length === 0 && pendingUpdates.length === 0) {
                        alert('所有品項都已是最新狀態！');
                        return;
                    }

                    // 顯示預覽
                    showImportPreview();
                });
            });
        }

        // 顯示導入預覽
        function showImportPreview() {
            const previewEl = document.getElementById('importPreview');
            const listEl = document.getElementById('importList');
            
            let html = '';
            
            // 新品項
            if (pendingImports.length > 0) {
                html += `<p class="text-xs font-bold text-emerald-600 mb-1"><i class="fas fa-plus-circle mr-1"></i>新增 ${pendingImports.length} 筆</p>`;
                html += pendingImports.map(item => `
                    <div class="flex items-center gap-2 p-2 bg-emerald-50 rounded-lg text-sm border border-emerald-200">
                        <input type="checkbox" class="import-check w-4 h-4" data-type="new" data-key="${item.key}" checked>
                        <span class="font-bold text-slate-700">${item.person}</span>
                        <span class="text-slate-400">-</span>
                        <span class="flex-1">${item.item} x${item.qty}</span>
                        <span class="text-xs text-emerald-600">${item.category || ''}</span>
                    </div>
                `).join('');
            }
            
            // 有變更的品項
            if (pendingUpdates.length > 0) {
                html += `<p class="text-xs font-bold text-blue-600 mb-1 mt-3"><i class="fas fa-sync-alt mr-1"></i>更新 ${pendingUpdates.length} 筆</p>`;
                html += pendingUpdates.map(u => `
                    <div class="p-2 bg-blue-50 rounded-lg text-sm border border-blue-200 mb-1">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" class="import-check w-4 h-4" data-type="update" data-key="${u.proxyKey}" checked>
                            <span class="font-bold text-slate-700">${u.new.person}</span>
                            <span class="text-slate-400">-</span>
                            <span class="flex-1">${u.new.item}</span>
                        </div>
                        <div class="ml-6 mt-1 text-xs text-slate-500">
                            ${u.old.person !== u.new.person ? `<span class="text-red-500 line-through">${u.old.person}</span> → <span class="text-emerald-600">${u.new.person}</span><br>` : ''}
                            ${u.old.item !== u.new.item ? `<span class="text-red-500 line-through">${u.old.item}</span> → <span class="text-emerald-600">${u.new.item}</span><br>` : ''}
                            ${String(u.old.qty) !== String(u.new.qty) ? `數量: <span class="text-red-500 line-through">${u.old.qty}</span> → <span class="text-emerald-600">${u.new.qty}</span><br>` : ''}
                            ${(u.old.category || '') !== (u.new.category || '') ? `分類: <span class="text-red-500 line-through">${u.old.category || '無'}</span> → <span class="text-emerald-600">${u.new.category || '無'}</span><br>` : ''}
                            ${(u.old.note || '') !== (u.new.note || '') ? `備註: <span class="text-red-500 line-through">${u.old.note || '無'}</span> → <span class="text-emerald-600">${u.new.note || '無'}</span>` : ''}
                        </div>
                    </div>
                `).join('');
            }
            
            listEl.innerHTML = html;
            previewEl.classList.remove('hidden');
        }

        // 確認導入
        function confirmImport() {
            const checkboxes = document.querySelectorAll('.import-check:checked');
            if (checkboxes.length === 0) {
                alert('請至少選擇一個品項');
                return;
            }

            setSyncStatus('syncing', '導入中...');
            const promises = [];
            
            checkboxes.forEach(cb => {
                const type = cb.dataset.type;
                const key = cb.dataset.key;
                
                if (type === 'new') {
                    const item = pendingImports.find(i => i.key === key);
                    if (item) {
                        promises.push(proxyRef.push({
                            person: item.person,
                            item: item.item,
                            qty: parseInt(item.qty) || 1,
                            price: 0,
                            charge: 0,
                            paid: false,
                            sourceKey: item.key,
                            category: item.category || '',
                            note: item.note || '',
                            createdAt: Date.now()
                        }));
                    }
                } else if (type === 'update') {
                    const update = pendingUpdates.find(u => u.proxyKey === key);
                    if (update) {
                        // 只更新基本資訊，保留價格和收款狀態
                        promises.push(proxyRef.child(key).update({
                            person: update.new.person,
                            item: update.new.item,
                            qty: parseInt(update.new.qty) || 1,
                            category: update.new.category || '',
                            note: update.new.note || ''
                        }));
                    }
                }
            });

            Promise.all(promises)
                .then(() => {
                    const newCount = [...checkboxes].filter(cb => cb.dataset.type === 'new').length;
                    const updateCount = [...checkboxes].filter(cb => cb.dataset.type === 'update').length;
                    let msg = '完成！';
                    if (newCount > 0) msg += `\n新增 ${newCount} 筆`;
                    if (updateCount > 0) msg += `\n更新 ${updateCount} 筆`;
                    if (newCount > 0) msg += '\n\n請記得填寫新品項的價格。';
                    alert(msg);
                    cancelImport();
                })
                .catch(err => {
                    setSyncStatus('error', '導入失敗');
                    alert('導入失敗：' + err.message);
                });
        }

        // 取消導入
        function cancelImport() {
            pendingImports = [];
            pendingUpdates = [];
            document.getElementById('importPreview').classList.add('hidden');
            document.getElementById('importList').innerHTML = '';
        }
    </script>
</body>
</html>
